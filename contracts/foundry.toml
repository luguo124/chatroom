[profile.default]
src = "."
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

# Monad testnet 配置
# 必须使用 Monad Foundry fork: https://docs.monad.xyz/tooling-and-infra/toolkits/monad-foundry
[profile.monad-testnet]
eth_rpc_url = "https://testnet-rpc.monad.xyz"
chain_id = 10143

# 主网配置（MVP 暂不使用）
[profile.monad-mainnet]
eth_rpc_url = "https://rpc.monad.xyz"
chain_id = 143
